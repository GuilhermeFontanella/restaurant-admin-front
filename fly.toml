app = 'restaurant-admin-front'
primary_region = 'gru'

[build]
  [build.args]
    VITE_API_URL = 'https://restaurant-admin-service-ydvk4w.fly.dev'
    VITE_ORDER_MANAGER_URL = 'https://order-manager-cipcha.fly.dev'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
